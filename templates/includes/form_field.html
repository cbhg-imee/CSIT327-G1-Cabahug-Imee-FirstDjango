{# Renders ONE Bootstrap-styled form field. Usage: {% include "includes/form_field.html" with field=form.username %} #}
<div class="form-group field-group mb-4 {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text field-help">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}
        <div class="field-error">{{ error }}</div>
    {% endfor %}
</div>
